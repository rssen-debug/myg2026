name: GODLIKE public Solana trench discovery smoke (no trades)
on:
  push:
    branches: [godlike2026-paper-audit]
    paths:
      - 'market_discovery.py'
      - 'trench_evidence.py'
      - '.github/workflows/godlike-trench-discovery-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependency set
        run: python -m pip install -r requirements.txt
      - name: Fetch bounded live public token discovery WITHOUT trading
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from market_discovery import discover_mints
          tokens,stats=discover_mints(max_mints=200,gecko_pages=1)
          output={"mode":"DISCOVERY_ONLY_NO_WALLET", "actual_money_used":False,
                  "profitability_validated":False,
                  "selected_token_count":len(tokens),
                  "sample_tokens":tokens[:8],
                  "source_status":stats}
          Path("public_trench_discovery.json").write_text(json.dumps(output,indent=2))
          print(json.dumps({"sources":stats["sources"],
                            "unique":stats["total_unique"],
                            "selected":len(tokens),
                            "completion":stats["completion"]},indent=2))
          assert len(tokens)<=200
          assert any(s["source"]=="gecko_trending_pools" for s in stats["sources"])
          PY
      - name: Publish bounded public-source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godlike-public-discovery-no-trades
          path: public_trench_discovery.json
          if-no-files-found: warn
          retention-days: 14
