name: GODLIKE read-only $20 Solana round-trip quote costs
on:
  push:
    branches: [godlike2026-paper-audit]
    paths:
      - 'jupiter_roundtrip_20usd.py'
      - '.github/workflows/godlike-roundtrip-quote-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quote parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Observe only public Jupiter V2 buy and reverse sell quote economics
        run: python -u jupiter_roundtrip_20usd.py
      - name: Preserve pricing, route mismatch and missing quote diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godlike-20usd-roundtrip-readonly
          path: jupiter_roundtrip_20usd_report.json
          if-no-files-found: warn
          retention-days: 14
